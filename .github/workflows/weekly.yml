name: weekly

# Every Monday, ready before Maya starts at 08:30 Jerusalem time.
# The Base44 app's "Monday pricing run" workflow starts this at 07:30 Israel time (through
# workflow_dispatch, like Run now, with notify on). GitHub's own cron is the fallback at 07:45:
# in a test it started over 15 minutes late. It runs in UTC and Israel changes clocks, so both
# offsets are scheduled, and it only proceeds at 07:xx–08:xx local time if nothing ran that day.
on:
  schedule:
    - cron: "45 4 * * 1"   # 07:45 in summer (UTC+3)
    - cron: "45 5 * * 1"   # 07:45 in winter (UTC+2)
  workflow_dispatch:         # Run workflow button, the app's Run now, and the Base44 Monday workflow
    inputs:
      notify:
        description: "Also send the Slack message (normally only the Monday run does)"
        type: boolean
        default: false

permissions:
  contents: write           # commit the run's JSON recording back to the repo

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Is it time?
        id: due
        run: |
          echo "run_key=$(date -u +%Y-%m-%dT%H%MZ)" >> "$GITHUB_OUTPUT"   # one key for the whole run
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          hour=$(TZ=Asia/Jerusalem date +%H)
          today=$(date -u +%F)
          if [ "$hour" != "07" ] && [ "$hour" != "08" ]; then
            echo "Local time is ${hour}:xx in Jerusalem; the other schedule covers this week."; echo "go=no" >> "$GITHUB_OUTPUT"
          elif ls -d recordings/runs/${today}T* >/dev/null 2>&1; then
            echo "Already ran today."; echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.due.outputs.go == 'yes'
        with:
          python-version: "3.13"

      - name: Show the run as running in the app
        if: steps.due.outputs.go == 'yes'
        env:
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
          BASE44_TOKEN: ${{ secrets.BASE44_TOKEN }}
        run: python -m brightloop mark --run-key "${{ steps.due.outputs.run_key }}" --status running --log-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Install the browser
        if: steps.due.outputs.go == 'yes'
        run: |
          pip install -e '.[live]'
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq tesseract-ocr   # the OCR check before the deck (brightloop/verify.py)

      - name: Capture, compare, decide, publish
        if: steps.due.outputs.go == 'yes'
        env:
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
          BASE44_TOKEN: ${{ secrets.BASE44_TOKEN }}
          BRIGHTLOOP_RUN_KEY: ${{ steps.due.outputs.run_key }}
        run: python -m brightloop live --output out/result.json

      - name: Build Maya's deck in Google Slides
        if: steps.due.outputs.go == 'yes'
        continue-on-error: true   # a deck failure is recorded on the run; the recording still gets committed
        env:
          DECK_SECRET: ${{ secrets.DECK_SECRET }}
          DECK_URL: https://bright-loop-watch.base44.app/functions/build-deck
        run: |
          run_key="${{ steps.due.outputs.run_key }}"
          curl -sS -m 180 --fail-with-body -X POST "$DECK_URL" \
            -H "Content-Type: application/json" -H "X-Deck-Secret: $DECK_SECRET" \
            -A "brightloop-pricing-watch/0.1" -d "{\"run_key\": \"$run_key\"}" | tee out/deck.json

      # One message with the deck link (Maya: "I'm not hunting through Drive on Monday morning").
      # Monday runs only, so a midweek Run now doesn't ping her. Skipped without the secret.
      - name: Tell Maya on Slack
        if: steps.due.outputs.go == 'yes' && (github.event_name == 'schedule' || inputs.notify)
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m brightloop notify --deck out/deck.json

      - name: Run summary
        if: steps.due.outputs.go == 'yes'
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("out/result.json"))
          run = r["run"]
          print(f"### {run['mode']} run, {run['started_at']}")
          print(f"{len(r['items'])} change(s), {len(r['skipped'])} skipped, {len(run['errors'])} error(s)")
          for i in r["items"]:
              print(f"- **{i['competitor']}**: {i['why']}")
          for e in run["errors"]:
              print(f"- error: {e}")
          EOF

      - name: Commit the recording
        if: steps.due.outputs.go == 'yes'
        run: |
          git config user.name "brightloop-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recordings/
          if git diff --cached --quiet; then echo "Nothing new to commit."; exit 0; fi
          git commit -m "Weekly run $(date -u +%Y-%m-%dT%H%MZ)"
          git push

      - name: Show the run as failed in the app
        if: (failure() || cancelled()) && steps.due.outputs.go == 'yes'
        env:
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
          BASE44_TOKEN: ${{ secrets.BASE44_TOKEN }}
        run: python -m brightloop mark --run-key "${{ steps.due.outputs.run_key }}" --status failed --error "The weekly workflow stopped before finishing (${{ job.status }}). See the GitHub Actions log." --log-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
